name: iOS Tests

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'ios/**'
      - 'scripts/ios-verify-xcresult.sh'
      - '.github/workflows/ios-tests.yml'
  push:
    branches: [main, staging]
    paths:
      - 'ios/**'
      - 'scripts/ios-verify-xcresult.sh'
      - '.github/workflows/ios-tests.yml'
  workflow_dispatch:

jobs:
  ios-tests:
    name: iOS Build & Tests
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: |
          # Find the latest available Xcode version
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH="/Applications/Xcode.app"
          fi
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Find simulator
        id: simulator
        run: |
          # Pick best available iPhone simulator
          SIM_NAME=$(xcodebuild -showdestinations \
            -project ios/Equinet/Equinet.xcodeproj \
            -scheme Equinet 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep -oE 'name:[^}]+' \
            | sed 's/name://' \
            | grep 'iPhone' \
            | sort -V \
            | tail -1 \
            | xargs)
          echo "Using simulator: $SIM_NAME"
          echo "name=$SIM_NAME" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          # KNOWN CRASHES (tracked in docs/sprints/backlog.md, "iOS: deinit-krasch på iOS 26.2-runtime"):
          # on the CI runtime (iOS 26.2 simulator, Xcode 26.3) the test host aborts with
          # "malloc: pointer being freed was not allocated" in swift_task_deinitOnExecutor
          # (TaskLocal::StopLookupScope) when these @MainActor classes are deallocated.
          # The tests pass locally (iOS 26.5 / Xcode 27). Exactly these tests are skipped so
          # that everything else is gated strictly; do NOT add tests here without a backlog note.
          SKIP_FLAGS=(
            -skip-testing:EquinetTests/CalendarSyncManagerTests
            -skip-testing:EquinetTests/BridgeHandlerTests/testDefaultInitUsesRealSpeechRecognizer
            -skip-testing:EquinetTests/DashboardViewModelTests/testPermanentDismissSurvivesNewInstance
            -skip-testing:EquinetTests/NetworkMonitorTests/testDebugOverrideDisconnects
            -skip-testing:EquinetTests/NetworkMonitorTests/testDebugOverrideReconnects
            -skip-testing:EquinetTests/NetworkMonitorTests/testDebugOverrideTriggersCallback
            -skip-testing:EquinetTests/NetworkMonitorTests/testDebugOverrideTrueKeepsConnected
            -skip-testing:EquinetTests/OfflineVerificationUITests/testOfflineChainWithDebugOverride
            -skip-testing:EquinetTests/SpeechRecognizerTests/testCustomAudioSessionIsInjected
            -skip-testing:EquinetTests/SpeechRecognizerTests/testDefaultInitCreatesValidInstance
          )
          echo "::warning::Skipping ${#SKIP_FLAGS[@]} tests/classes with a known deinit crash on the iOS 26.2 runtime (see workflow comment)"

          set +e
          xcodebuild test \
            -project ios/Equinet/Equinet.xcodeproj \
            -scheme Equinet \
            -destination 'platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}' \
            -only-testing:EquinetTests \
            "${SKIP_FLAGS[@]}" \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # The result bundle decides pass/fail (not a grep of the log). See script header.
          bash scripts/ios-verify-xcresult.sh "$EXIT_CODE" TestResults.xcresult

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            xcodebuild-output.log
          retention-days: 7

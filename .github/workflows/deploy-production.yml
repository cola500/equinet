name: Deploy to Production (manual)

# Säkerhetsmodell (2026-09-28, ersätter det tidigare push-triggade
# deploy-production-jobbet i quality-gates.yml):
#
# - ENDA triggern är workflow_dispatch. Ingen push, pull_request, tag,
#   release eller Dependabot-merge kan starta detta workflow -- de events
#   nämns inte alls i `on:` nedan, så det finns tekniskt inget att koppla
#   bort. En vanlig merge till main producerar noll produktionseffekt.
# - `sha` är ett obligatoriskt input. Workflowet använder ALDRIG github.sha
#   eller ett rörligt main -- det deployar exakt den commit som efterfrågas,
#   ingen annan.
# - `validate`-jobbet kör helt utan produktionshemligheter (ingen
#   `environment:`-bindning) och avgör om deployen ens FÅR försöka starta:
#     1. sha är ett fullständigt, giltigt 40-tecken hex-SHA
#     2. sha är en anfader till origin/main (dvs. finns på skyddad main)
#     3. en avslutad quality-gates.yml-körning finns för exakt denna sha,
#        och dess "Quality Gate Passed"-jobb lyckades
#     4. sha matchar staging_verified_sha (operatörens attestering av vilken
#        SHA som senast staging-verifierades) -- eller override_reason är
#        ifylld som ett uttryckligt, dokumenterat undantag. Det finns idag
#        ingen maskinläsbar markering av "senast staging-godkänd SHA"
#        (planerat framtida arbete, se docs/operations/staging-environment-
#        setup.md) -- detta är alltså en attesterad kontroll, inte en
#        oberoende bevisad kontroll. Den stoppar ändå kopiering/felskrivning
#        och tvingar fram en synlig, loggad motivering vid avvikelse.
# - `deploy`-jobbet körs under GitHub-environmentet "production" (secrets,
#   branch-restriktion, deployment-loggning) -- men UTAN required reviewers.
#   Godkännandepunkten är Johans uttryckliga instruktion att köra detta
#   workflow för en bestämd sha, inte ett GitHub-UI-godkännande.
# - `dry_run` (default true) kör hela valideringen samt `vercel pull` och
#   `vercel build` på riktigt (2026-09-28: medvetet INTE villkorade på
#   dry_run -- ingen av dem muterar något i Vercel, och det gör dry_run till
#   det enda sättet att bevisa att VERCEL_TOKEN faktiskt fungerar, t.ex.
#   efter en tokenrotation, utan att någonsin röra produktionsmiljön). Bara
#   det faktiska `vercel deploy`-steget och verifieringen efter deploy hoppas över.
# - `concurrency` (workflow-brett) förhindrar att två produktionsdeployer
#   körs samtidigt -- en andra dispatch köar istället för att avbryta eller
#   krocka med en pågående.
# - VERCEL_TOKEN skickas ALDRIG till echo/logg -- bara som inline
#   `--token=${{ secrets.VERCEL_TOKEN }}` i samma mönster som redan använts
#   i detta repo. GitHub maskerar automatiskt exakta secret-värden i loggar.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exakt 40-tecken Git-SHA att deploya. Måste finnas på main och ha en grön Quality Gate Passed-körning."
        required: true
        type: string
      staging_verified_sha:
        description: "SHA:n du personligen verifierade som god på staging. Måste matcha 'sha' om inte override_reason är ifylld."
        required: true
        type: string
      override_reason:
        description: "Endast om staging_verified_sha skiljer sig från sha: förklara varför du ändå deployar. Lämna tomt annars."
        required: false
        type: string
        default: ""
      dry_run:
        description: "true (default) = validera och bygg, men hoppa över det faktiska deploy-steget. Sätt till false för en riktig produktionsdeploy."
        required: false
        type: boolean
        default: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate deploy candidate
    runs-on: ubuntu-latest
    outputs:
      quality_gate_run_id: ${{ steps.find-run.outputs.run_id }}
      commit_summary: ${{ steps.commit-info.outputs.summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SHA format
        run: |
          if ! [[ "${{ inputs.sha }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::'sha' måste vara ett fullständigt 40-tecken hex-SHA. Fick: '${{ inputs.sha }}'"
            exit 1
          fi
          echo "✓ SHA-format OK"

      - name: Verify SHA exists on protected main
        run: |
          if ! git cat-file -e "${{ inputs.sha }}^{commit}" 2>/dev/null; then
            echo "::error::${{ inputs.sha }} finns inte i repot."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" origin/main; then
            echo "::error::${{ inputs.sha }} är inte en anfader till origin/main. Vägrar deploya en SHA som inte finns på skyddad main."
            exit 1
          fi
          echo "✓ ${{ inputs.sha }} finns på origin/main"

      - name: Commit info
        id: commit-info
        run: |
          SUMMARY="$(git log -1 --format='%h %s (%ad)' --date=short "${{ inputs.sha }}")"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "Commit: $SUMMARY"

      - name: Find Quality Gate Passed run for this SHA
        id: find-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_JSON="$(gh run list --repo "${{ github.repository }}" --workflow quality-gates.yml \
            --json databaseId,headSha,status -L 100)"
          RUN_ID="$(echo "$RUN_JSON" | jq -r --arg sha "${{ inputs.sha }}" \
            '[.[] | select(.headSha == $sha and .status == "completed")] | sort_by(.databaseId) | last | .databaseId // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "::error::Ingen avslutad quality-gates.yml-körning hittad för ${{ inputs.sha }}. Deploy kräver bevisad grön CI för exakt denna commit."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "✓ Hittade körning $RUN_ID"

      - name: Verify Quality Gate Passed succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION="$(gh run view "${{ steps.find-run.outputs.run_id }}" --repo "${{ github.repository }}" --json jobs \
            | jq -r '.jobs[] | select(.name == "Quality Gate Passed") | .conclusion')"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Quality Gate Passed lyckades inte för denna SHA (utfall: ${CONCLUSION:-saknas}). Vägrar deploya."
            exit 1
          fi
          echo "✓ Quality Gate Passed är grön för ${{ inputs.sha }}"

      - name: Verify staging-approved SHA match
        run: |
          SHA="${{ inputs.sha }}"
          STAGING_SHA="${{ inputs.staging_verified_sha }}"
          REASON="${{ inputs.override_reason }}"
          if [ "$SHA" = "$STAGING_SHA" ]; then
            echo "✓ sha matchar staging_verified_sha -- samma SHA som verifierades i staging"
          elif [ -n "$REASON" ]; then
            echo "::warning::sha ($SHA) skiljer sig från staging_verified_sha ($STAGING_SHA). Dokumenterat undantag: $REASON"
          else
            echo "::error::sha ($SHA) matchar inte staging_verified_sha ($STAGING_SHA), och ingen override_reason gavs."
            echo "::error::Det finns idag ingen maskinläsbar 'senast staging-godkänd'-markering (se docs/operations/staging-environment-setup.md) -- denna kontroll är operatörens egen attestering."
            echo "::error::Om avvikelsen är avsiktlig: kör om med override_reason ifylld och en tydlig motivering."
            exit 1
          fi

  deploy:
    name: Deploy to Production
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD_HEALTH_URL: https://equinet.johanlindengard.com/api/health

    steps:
      - name: Summary
        run: |
          echo "SHA:            ${{ inputs.sha }}"
          echo "Commit:         ${{ needs.validate.outputs.commit_summary }}"
          echo "Quality Gate:   run ${{ needs.validate.outputs.quality_gate_run_id }}"
          echo "dry_run:        ${{ inputs.dry_run }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry_run=true -- Pull och Build körs på riktigt (verifierar att VERCEL_TOKEN fungerar, mutar inget), men Deploy och verifieringen efter deploy hoppas över. Ingen produktionseffekt."
          fi

      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Körs ALLTID, även vid dry_run=true -- varken pull eller build muterar
      # något i Vercel (pull läser bara konfiguration, build kompilerar
      # lokalt i runnern). Det gör dry_run till det enda sättet att
      # verifiera att VERCEL_TOKEN faktiskt fungerar utan att någonsin röra
      # produktionsmiljön -- vilket är precis vad en tokenrotation behöver
      # kunna bevisas med.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Enda muterande steget -- körs ENDAST vid dry_run=false.
      # Sparar deployment-URL:en så att verifieringen kan fråga exakt den
      # deploymenten via Vercels API (inte bara det publika aliaset).
      - name: Deploy
        id: deploy
        if: inputs.dry_run == false
        run: |
          rc=0
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} >deploy.out 2>deploy.err || rc=$?
          cat deploy.err >&2
          cat deploy.out
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          # The deployment URL is what the CLI prints on stdout; stderr is only a fallback
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.out | tail -1 || true)
          if [ -z "$url" ]; then url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.err | tail -1 || true); fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Verifierar i två nivåer och säger uttryckligen vad som INTE kunde verifieras:
      #  1. Deploymentnivå via Vercels API (fungerar trots bot-skyddet): READY,
      #     target=production, produktionsaliaset pekar på den nya deploymenten,
      #     och commit-SHA:n matchar den begärda om API:t anger den.
      #  2. Appnivå via HTTP mot PROD_HEALTH_URL. Vercels Security Checkpoint
      #     (HTTP 429 + x-vercel-mitigated: challenge) blockerar automatiska anrop;
      #     då rapporteras appen som "EJ verifierad" i stället för som OK. En app
      #     som svarar men är ohälsosam, eller inte går att nå alls, felar steget.
      - name: Verify deployment and health
        if: inputs.dry_run == false
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ inputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -u
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          rollback="Se docs/operations/vercel-token-sync-and-production-deploy.md för rollback."
          fail=0
          rows=""
          # Values from the Vercel API are untrusted text: strip anything that could
          # inject workflow annotations or break the markdown table.
          clean() { printf '%s' "$1" | tr -d '\r\n' | tr -c '[:alnum:]._:/@=-' '?' | cut -c1-120; }
          add_row() { rows="${rows}| $1 | $2 |"$'\n'; }

          host=$(clean "${DEPLOY_URL#https://}"); host="${host%%/*}"
          prod_host="${PROD_HEALTH_URL#https://}"; prod_host="${prod_host%%/*}"

          if [ -z "$host" ]; then
            echo "::error::Ingen deployment-URL fångades från Deploy-steget -- kan inte verifiera deploymenten. $rollback"
            add_row "Deployment" "✗ ingen URL fångades"
            fail=1
          else
            # 1. Deployment level (Vercel API; independent of the bot protection)
            state="UNKNOWN"; target=""; sha=""; alias_ok=0; resp=""
            for attempt in 1 2 3 4 5 6; do
              resp=$(curl -sS --max-time 20 -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v13/deployments/${host}?teamId=${VERCEL_ORG_ID}") || resp=""
              state=$(clean "$(printf '%s' "$resp" | jq -r '.readyState // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)")
              target=$(clean "$(printf '%s' "$resp" | jq -r '.target // ""' 2>/dev/null || true)")
              sha=$(clean "$(printf '%s' "$resp" | jq -r '.meta.githubCommitSha // ""' 2>/dev/null || true)")
              if printf '%s' "$resp" | jq -e --arg h "$prod_host" '(.alias // []) | index($h)' >/dev/null 2>&1; then alias_ok=1; else alias_ok=0; fi
              if [ "$state" = "READY" ] && [ "$alias_ok" = "1" ]; then break; fi
              # A terminal state will not change, so do not keep polling
              case "$state" in ERROR|CANCELED|DELETED) break ;; esac
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done

            if [ "$state" = "READY" ]; then add_row "Deployment ($host)" "✓ READY"; else
              echo "::error::Deploymenten $host är inte READY (readyState=$state). $rollback"
              add_row "Deployment ($host)" "✗ readyState=$state, förväntade READY"; fail=1
            fi
            if [ "$target" = "production" ]; then add_row "Target" "✓ production"; else
              echo "::error::Deploymenten har target '$target', förväntade 'production'. $rollback"
              add_row "Target" "✗ '$target', förväntade production"; fail=1
            fi
            if [ "$alias_ok" = "1" ]; then add_row "Alias $prod_host" "✓ pekar på den nya deploymenten"; else
              echo "::error::Aliaset $prod_host pekar inte på den nya deploymenten. $rollback"
              add_row "Alias $prod_host" "✗ inte tilldelat den nya deploymenten"; fail=1
            fi
            if [ -z "$sha" ]; then
              echo "::warning::API-svaret anger ingen commit-SHA för deploymenten -- kunde inte bekräfta att $EXPECTED_SHA deployades."
              add_row "Commit-SHA" "⚠ anges inte av API:t (förväntad $EXPECTED_SHA)"
            elif [ "$sha" = "$EXPECTED_SHA" ]; then add_row "Commit-SHA" "✓ $sha"; else
              echo "::error::Deployad commit ($sha) skiljer sig från begärd SHA ($EXPECTED_SHA). $rollback"
              add_row "Commit-SHA" "✗ $sha, begärd $EXPECTED_SHA"; fail=1
            fi
          fi

          # 2. App level (HTTP). Retried for transient failures, but a bot challenge is final.
          app_status="unreachable"; code="000"
          hdr=$(mktemp); body=$(mktemp)
          for attempt in 1 2 3; do
            code=$(curl -sS -o "$body" -D "$hdr" -w '%{http_code}' --max-time 15 "$PROD_HEALTH_URL" 2>/dev/null) || code="000"
            if [ "$code" = "200" ] && jq -e '.status == "ok"' "$body" >/dev/null 2>&1; then app_status="ok"; break; fi
            # Only Vercel's bot challenge counts as "blocked"; other mitigations (deny, rate limit) are failures
            if grep -qiE '^x-vercel-mitigated:[[:space:]]*challenge' "$hdr"; then app_status="blocked"; break; fi
            if [ "$code" = "000" ]; then app_status="unreachable"; else app_status="unhealthy"; fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          code=$(clean "$code")

          case "$app_status" in
            ok) add_row "Appens hälsa ($PROD_HEALTH_URL)" "✓ HTTP 200, status ok" ;;
            blocked)
              echo "::warning::Appens hälsa EJ verifierad: Vercel Security Checkpoint (HTTP $code, x-vercel-mitigated: challenge) blockerar automatiska anrop mot $PROD_HEALTH_URL. Deploymenten är verifierad via Vercels API, men verifiera appen manuellt i en webbläsare."
              add_row "Appens hälsa ($PROD_HEALTH_URL)" "⚠ **EJ verifierad** -- blockerad av Vercel Security Checkpoint (HTTP $code). Verifiera manuellt i en webbläsare." ;;
            unhealthy)
              echo "::error::Appen svarade men är ohälsosam (HTTP $code) på $PROD_HEALTH_URL. $rollback"
              add_row "Appens hälsa ($PROD_HEALTH_URL)" "✗ HTTP $code, förväntade 200 med status ok"; fail=1 ;;
            *)
              echo "::error::Kunde inte nå $PROD_HEALTH_URL alls efter 3 försök. $rollback"
              add_row "Appens hälsa ($PROD_HEALTH_URL)" "✗ kunde inte nås"; fail=1 ;;
          esac

          {
            echo "## Produktionsverifiering"
            echo ""
            echo "| Kontroll | Resultat |"
            echo "|---|---|"
            printf '%s' "$rows"
          } >> "$summary"

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "✓ Verifieringen klar"

      - name: Dry-run complete
        if: inputs.dry_run == true
        run: echo "✓ dry_run klar -- Pull+Build lyckades (VERCEL_TOKEN fungerar). Ingen produktionsdeploy gjordes. Kör om med dry_run=false för en riktig deploy."
